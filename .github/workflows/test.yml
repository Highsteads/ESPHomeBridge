name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # matches Indigo 2025.2's embedded Python
      - name: Syntax check
        run: python -m compileall -q "ESPHomeBridge.indigoPlugin/Contents/Server Plugin"
      - name: Lint (ruff — errors only, see ruff.toml)
        run: |
          pip install ruff
          ruff check .
      # The job has been named "tests" since it was created and ran none —
      # compileall and ruff say the code parses and lints, which reads as
      # covered while the suite below had never once run on a push. Same fault
      # Dashboards fixed in v2.73.0 and nobody swept.
      # The plugin's own runtime dependencies. Without them plugin.py cannot be
      # imported, and the failure does not look like a missing package: two of
      # these repos' conftests caught it and carried on, so every test reported
      # "module 'plugin' has no attribute 'Plugin'" instead. Installing them
      # here also makes CI the first thing that checks requirements.txt is
      # actually installable.
      - name: Install plugin dependencies
        run: pip install -r "ESPHomeBridge.indigoPlugin/Contents/Server Plugin/requirements.txt"
      - name: Contract tests (pytest)
        run: |
          pip install pytest
          python -m pytest tests -q
